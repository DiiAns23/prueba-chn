spring:
  application:
    name: chn-prestamos
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=chn_prestamos;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway es el dueño del esquema
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # Instant -> datetime2 (no datetimeoffset)
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXP_MINUTES:120}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD}
    operador-username: ${OPERADOR_USERNAME:operador}
    operador-password: ${OPERADOR_PASSWORD}
    cliente-username: ${CLIENTE_USERNAME:cliente}
    cliente-password: ${CLIENTE_PASSWORD:}   # opcional: si se define, siembra cliente demo + usuario CLIENTE

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: info
