name: CI - build & push de imágenes

# Construye las imágenes Docker de backend y frontend y las publica en GitHub Container
# Registry (GHCR). NO despliega a producción: solo deja las imágenes listas para descargar
# (docker compose -f docker-compose.registry.yml up) sin tener que compilar en local.

on:
  push:
    branches: [main]      # solo cuando el código llega a main (push/merge de un PR)
  workflow_dispatch:       # ejecución manual desde la pestaña Actions

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR exige el owner en minúsculas.
      - name: Owner en minúsculas
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/chn-${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.value }}/chn-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
